@if (detailedCv(); as cv) {
    <article class="candidate">
        <div class="cover"></div>

        <div class="cardBody">
            @if (cv.path) {
                <img
                class="portrait"
                [src]="cv.path">
            } @else {
                <div class="portrait portraitPlaceholder">
                    {{ cv.firstname.charAt(0) }}
                </div>
            }
            <h2>{{ cv.firstname }} {{ cv.name }}</h2>
            <p class="job">{{ cv.job }}</p>
            <div class="facts">
                <p>Age: {{ cv.age }}</p>
                <p>CIN: {{ cv.cin }}</p>
            </div>
        </div>
        <footer class="cardFooter">
            CV profile . {{ cv.id }}
            <div class="buttons">
                <button mat-button (click)="hireCv(cv)">Embaucher</button>
                <button mat-button [routerLink]="['/cvs', cv.id]">Détails</button>
                <!-- we're combining the pieces: /cvs/1 , 2 ... (aka building the link) -->
            </div>
        </footer>
    </article>
} @else {
    <p>Select a CV to see its details.</p>
}
